name: build-on-hosted-runner

on:
  workflow_run:
    workflows:
      - build-img-ghrunner-test
    types:
      - completed

jobs:
  approve:
    name: approve-ghrunner-test
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-24.04
    environment: ghrunner-test
    steps:
      - name: Approval gate passed
        run: echo "Deployment to ghrunner-test environment approved"

  hosted_runner_provision:
    needs: approve
    uses: ./.github/workflows/provision-hosted-runner.yaml
    with:
      runner_repo: "https://github.com/${{github.repository}}"
      operating_system: windows
    secrets: inherit

  test_run_selfhosted_runner:
    runs-on: [self-hosted, x64, Windows]
    needs: hosted_runner_provision
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Test
        run: go test -v ./...

  destroy_hosted_runner:
    needs:
      - approve
      - test_run_selfhosted_runner
      - hosted_runner_provision
    if: >-
      always() &&
      needs.approve.result == 'success' &&
      !contains(needs.hosted_runner_provision.result, 'skipped') &&
      !contains(needs.hosted_runner_provision.result, 'cancelled')
    uses: ./.github/workflows/destroy-hosted-runner.yaml
    with:
      operating_system: windows
    secrets: inherit
